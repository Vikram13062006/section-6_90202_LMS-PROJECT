# Active profile defaults to h2 for local development.
# Set APP_PROFILE=mysql (or pass -Dspring-boot.run.profiles=mysql) to use MySQL.
spring.profiles.active=mysql

# Hibernate / JPA (common)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=${PORT:8080}

# File upload settings
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# JWT settings
jwt.secret=${JWT_SECRET:DevOnly_ChangeThisSecretToAtLeast32Chars_LongValue1234567890}
jwt.expiration-ms=86400000

# Jackson settings
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS settings (comma-separated origin patterns)
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,https://*.netlify.app}