# Active profile (H2 default for local)
spring.profiles.active=${APP_PROFILE:h2}

# ========================
# JPA / Hibernate
# ========================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================
# SERVER CONFIG (IMPORTANT FOR RENDER)
# ========================
server.port=${PORT}

# ========================
# FILE UPLOAD (FIXED FOR RENDER)
# ========================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=/tmp/uploads

# ========================
# JWT CONFIG
# ========================
jwt.secret=ChangeMeChangeMeChangeMeChangeMeChangeMe
jwt.expiration-ms=86400000

# ========================
# JACKSON CONFIG
# ========================
spring.jackson.serialization.write-dates-as-timestamps=false

# ========================
# CORS CONFIG (IMPORTANT FIX)
# Add your FRONTEND Render URL here
# ========================
app.cors.allowed-origin-patterns=http://localhost:3000,http://localhost:5173,https://section-6-90202-lms-project.onrender.com