spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=${APP_UPLOAD_DIR:uploads}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

spring.jackson.serialization.write-dates-as-timestamps=false

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,https://*.netlify.app}